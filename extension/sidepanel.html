<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8" /><link rel="stylesheet" href="sidepanel.css" /></head>
<body>
  <header class="bar">
    <div class="brand"><span class="mark"></span>标注投递<i class="dot" id="status"></i><span id="statusText" class="sr"></span></div>
    <button class="chip" id="btnSession"><b id="selTitle">未选择</b><span class="chev">⌄</span></button>
  </header>

  <div class="tools" id="toolTabs"></div>

  <nav class="tabs">
    <button class="tab active" id="tabFeedback">反馈</button>
    <button class="tab" id="tabSessions">会话 <span class="pill" id="sessCount">0</span></button>
  </nav>

  <main>
    <section class="pane" id="paneFeedback">
      <button class="pick-area" id="btnPick">
        <span class="pick-plus">＋</span>
        <span class="pick-copy"><b>点击选择页面元素</b><small>悬停高亮 · Esc 取消</small></span>
      </button>

      <div class="picked hidden" id="pickedBox">
        <code id="pickedSel"></code>
        <div class="muted" id="pickedTxt"></div>
      </div>

      <div class="toolsline">
        <label class="switch"><input type="checkbox" id="capConsole" checked><span></span>捕获控制台</label>
        <span class="muted" id="consoleCount">0 条</span>
        <button class="link" id="btnGrabLogs">抓取</button>
        <span class="sep"></span>
        <button class="link" id="btnClearCaps">清除附件</button>
      </div>
      <div class="chips hidden" id="capsChips"></div>

      <textarea id="comment" class="input" rows="3" placeholder="写一句备注，例如：这个卡片间距太挤"></textarea>
      <div class="row">
        <select id="severity" class="input sm">
          <option value="important">重要</option>
          <option value="suggestion">建议</option>
          <option value="blocking">阻塞</option>
        </select>
        <button class="secondary" id="btnQueue">加入队列</button>
      </div>

      <div class="divider"></div>

      <div class="section-head"><span>队列 <b class="pill" id="queueCount">0</b></span><button class="link" id="btnClearQueue">清空</button></div>
      <div class="qlist" id="queue"></div>

      <div class="opts">
        <label><span>方式</span><select id="mode" class="input sm"></select></label>
        <label><span>模型</span><select id="model" class="input sm"></select></label>
        <label><span>强度</span><select id="effort" class="input sm"></select></label>
      </div>

      <div class="hint hidden" id="sendHint"></div>

      <div class="divider"></div>
      <div class="section-head"><span>回复</span><button class="link" id="btnLoadMsgs">读最近</button></div>
      <div class="messages" id="messages"><div class="empty">发送后这里会显示回复</div></div>
    </section>

    <section class="pane hidden" id="paneSessions">
      <div class="row">
        <input id="search" class="input" placeholder="搜索项目 / 名字 / ID" />
        <button class="link" id="btnRefresh">刷新</button>
      </div>
      <div class="pop-list tall" id="sessionList"></div>
      <div class="row">
        <input id="manualId" class="input mono" placeholder="或粘贴会话 ID" />
        <button class="link" id="btnUseId">使用</button>
      </div>
      <button class="secondary block" id="btnNew">＋ 新建会话</button>
    </section>
  </main>

  <footer class="actionbar">
    <button class="act" id="fabPick"><span>⌖</span>选元素</button>
    <button class="act" id="btnShot"><span>▣</span>截图</button>
    <button class="act primary" id="btnSend">发送 <b id="fabCount">0</b></button>
  </footer>

  <div class="modal hidden" id="newModal">
    <div class="sheet">
      <div class="sheet-head"><b>新建会话</b><button class="link" id="btnNewClose">✕</button></div>
      <label class="field"><span>工作目录</span><input id="newCwd" class="input mono" placeholder="/Users/you/Project/xxx" /></label>
      <div class="opts">
        <label><span>模型</span><select id="newModel" class="input sm"></select></label>
        <label><span>强度</span><select id="newEffort" class="input sm"></select></label>
      </div>
      <label class="field"><span>第一句话</span><textarea id="newMsg" class="input" rows="4"></textarea></label>
      <button class="primary block" id="btnNewRun">创建并发送</button>
      <div class="hint hidden" id="newHint"></div>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
